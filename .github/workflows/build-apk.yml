name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Detect Project Directory
        run: |
          if [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          elif [ -f "CBT_SMKN14_Exambrowser_Beta_020/settings.gradle.kts" ]; then
            PROJECT_DIR="CBT_SMKN14_Exambrowser_Beta_020"
          else
            PROJECT_DIR=$(dirname "$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)")
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CBT-SMKN14-Exambrowser-Beta-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
